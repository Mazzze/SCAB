[package]
name = "scab-engine"
version = "0.8.0"
edition = "2021"
description = "Parallel, content-addressed OpenSCAD mesh scheduler for SCAB"
license = "MIT"

[[bin]]
name = "scab-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
